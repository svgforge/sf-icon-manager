name: Release to WordPress.org

on:
    push:
        tags:
            - 'v[0-9]*'
            - '[0-9]*'
    workflow_dispatch:
        inputs:
            tag_name:
                description: 'Git tag whose release ZIP should be deployed'
                required: false
                default: 'v0.3.3'
                type: string

permissions:
    contents: write

jobs:
    release:
        name: Build, deploy and release
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Setup PHP
              if: ${{ startsWith(github.ref, 'refs/tags/') }}
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: mbstring
                  coverage: none
                  tools: composer:v2

            - name: Install PHP dependencies (runtime only)
              if: ${{ startsWith(github.ref, 'refs/tags/') }}
              run: composer install --no-dev --no-interaction --prefer-dist --no-progress

            - name: Setup pnpm
              if: ${{ startsWith(github.ref, 'refs/tags/') }}
              uses: pnpm/action-setup@v6

            - name: Setup Node.js
              if: ${{ startsWith(github.ref, 'refs/tags/') }}
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install dependencies
              if: ${{ startsWith(github.ref, 'refs/tags/') }}
              run: pnpm install --frozen-lockfile

            - name: Lint, typecheck and unit tests
              if: ${{ startsWith(github.ref, 'refs/tags/') }}
              run: |
                  pnpm lint:js
                  pnpm run typecheck
                  pnpm run test-unit-js

            - name: Build plugin
              if: ${{ startsWith(github.ref, 'refs/tags/') }}
              run: pnpm run build

            - name: Build plugin ZIP
              if: ${{ startsWith(github.ref, 'refs/tags/') }}
              run: pnpm run plugin-zip

            - name: Download release ZIP
              if: ${{ github.event_name == 'workflow_dispatch' }}
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh release download "${{ inputs.tag_name }}" --pattern "sf-icon-manager.zip" --dir "$GITHUB_WORKSPACE"

            - name: Prepare deploy contents from plugin ZIP
              run: |
                  rm -rf "$GITHUB_WORKSPACE/deploy"
                  mkdir -p "$GITHUB_WORKSPACE/deploy"
                  unzip -q "$GITHUB_WORKSPACE/${{ github.event.repository.name }}.zip" -d "$GITHUB_WORKSPACE/deploy"

            - name: Resolve plugin version
              id: version
              run: echo "version=$(sed -n 's/^Stable tag:[[:space:]]*//p' readme.txt)" >> "$GITHUB_OUTPUT"

            - name: Deploy to WordPress.org
              if: ${{ vars.WP_ORG_DEPLOY == '1' }}
              uses: 10up/action-wordpress-plugin-deploy@stable
              with:
                  generate-zip: false
              env:
                  BUILD_DIR: ${{ github.workspace }}/deploy/sf-icon-manager
                  VERSION: ${{ steps.version.outputs.version }}
                  SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
                  SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}

            - name: Create GitHub release
              if: ${{ startsWith(github.ref, 'refs/tags/') }}
              uses: softprops/action-gh-release@v3
              with:
                  tag_name: ${{ inputs.tag_name || github.ref_name }}
                  files: ${{ github.workspace }}/${{ github.event.repository.name }}.zip
                  fail_on_unmatched_files: true
